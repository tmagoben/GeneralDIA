[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "generaldia"
version = "3.0.1"
description = "Observable-constrained finite-state diabatic Hamiltonian models"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Timbila Cohen-Magobenny"}]
keywords = [
    "diabatic Hamiltonian",
    "nonadiabatic dynamics",
    "quantum chemistry",
    "machine learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.24,<3", "torch>=2.1,<3"]

[project.urls]
Homepage = "https://github.com/tmagoben/GeneralDIA"
Repository = "https://github.com/tmagoben/GeneralDIA"
Issues = "https://github.com/tmagoben/GeneralDIA/issues"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=7.4",
    "pytest-cov>=5",
    "ruff>=0.8",
    "scipy>=1.10,<2",
]
pyscf = ["pyscf>=2.8,<3"]
quantum = ["scipy>=1.10,<2", "pennylane>=0.40,<1", "qiskit>=1,<3"]
all = [
    "build>=1.2",
    "pytest>=7.4",
    "pytest-cov>=5",
    "ruff>=0.8",
    "scipy>=1.10,<2",
    "pyscf>=2.8,<3",
    "pennylane>=0.40,<1",
    "qiskit>=1,<3",
]

[tool.setuptools.packages.find]
include = ["generaldia*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["optional: tests requiring optional third-party backends"]

[tool.coverage.run]
source = ["generaldia"]
branch = true
omit = [
    "generaldia/electronic_structure/pyscf_backend.py",
    "generaldia/quantum/pennylane_backend.py",
    "generaldia/quantum/qiskit_backend.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"examples/**/*.py" = ["T201"]
