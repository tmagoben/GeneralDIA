name: core

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'ruff>=0.8'
      - run: ruff check . && ruff format --check .
      - name: Record suggested formatting if a check fails
        if: failure()
        run: |
          ruff check --fix --exit-zero .
          ruff format .
          git diff --binary --output="$RUNNER_TEMP/style.patch"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: style-diagnostics
          path: ${{ runner.temp }}/style.patch
          retention-days: 3

  evidence-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "services/evidence/requirements*.txt"
      - run: python -m pip install -r services/evidence/requirements-test.txt
      - run: python -m pytest -q services/evidence/test_service.py

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.11"
          - os: macos-15
            python-version: "3.11"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest --cov=generaldia --cov-report=term-missing --cov-fail-under=87
      - run: python -m build
      - run: python examples/01_avoided_crossing.py
      - run: python examples/02_molecular_invariance.py
      - run: python examples/04_pauli_state_encoding.py
      - run: python examples/06_state_tracking.py
      - run: python examples/07_qwc_measurement_grouping.py
      - run: python examples/08_path_aware_diagnostics.py
      - run: python examples/09_invariant_path_training.py
      - run: python examples/10_shared_operators.py
      - run: python examples/11_berry_loop.py
      - run: python examples/12_coupling_numerator_certification.py
      - run: python examples/13_omitted_state_certification.py

  molecular-loop:
    # Physical electronic-structure validation is mandatory for this slice.
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,pyscf]"
      - run: python -c "import pyscf; print('PySCF', pyscf.__version__)"
      - run: >-
          pytest -q tests/test_fci_loop.py tests/test_fci_charged.py
          tests/test_h3plus_ci.py tests/test_h3plus_comparison.py tests/test_transition_band.py
      - run: python examples/14_physical_fci_loop.py
      - name: Certify physical H3+ conical intersection
        run: python examples/15_h3plus_molecular_ci.py > h3plus_ci_evidence.json
      - name: Compare independent STO-3G and 6-31G physical certificates
        run: python examples/16_h3plus_basis_comparison.py > h3plus_basis_comparison.json
      - name: Fit and certify learned H3+ Hamiltonians on held-out physical paths
        run: python examples/17_learned_h3plus_topology.py > h3plus_learned_topology.json
      - name: Check H3+ optical strengths against independent two-electron diagonalization
        run: python examples/18_h3plus_transition_band.py > h3plus_transition_band.json
      - name: Check both evidence formats without scientific dependencies
        run: python -I -S scripts/check_h3plus_report.py h3plus_ci_evidence.json h3plus_basis_comparison.json
      - name: Validate and display numerical evidence
        run: |
          python -m json.tool h3plus_ci_evidence.json > /dev/null
          cat h3plus_ci_evidence.json
      - name: Publish H3+ CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h3plus-physical-ci-evidence
          path: |
            h3plus_ci_evidence.json
            h3plus_basis_comparison.json
            h3plus_learned_topology.json
            h3plus_transition_band.json
          if-no-files-found: error
          retention-days: 90
