name: core

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.11"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=generaldia --cov-report=term-missing --cov-fail-under=87
      - run: python -m build
      - run: python examples/01_avoided_crossing.py
      - run: python examples/02_molecular_invariance.py
      - run: python examples/04_pauli_state_encoding.py
      - run: python examples/06_state_tracking.py
      - run: python examples/07_qwc_measurement_grouping.py
      - run: python examples/08_path_aware_diagnostics.py
      - run: python examples/09_invariant_path_training.py
      - run: python examples/10_shared_operators.py
      - run: python examples/11_berry_loop.py
      - run: python examples/12_coupling_numerator_certification.py
      - run: python examples/13_omitted_state_certification.py

  molecular-loop:
    # Physical electronic-structure validation is mandatory for this slice.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,pyscf]"
      - run: python -c "import pyscf; print('PySCF', pyscf.__version__)"
      - run: pytest tests/test_fci_loop.py tests/test_fci_charged.py tests/test_h3plus_ci.py -q
      - run: python examples/14_physical_fci_loop.py
      - name: Certify physical H3+ conical intersection
        run: python examples/15_h3plus_molecular_ci.py > h3plus_ci_evidence.json
      - name: Validate and display numerical evidence
        run: |
          python -m json.tool h3plus_ci_evidence.json > /dev/null
          cat h3plus_ci_evidence.json
      - name: Publish H3+ CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h3plus-physical-ci-evidence
          path: h3plus_ci_evidence.json
          if-no-files-found: error
          retention-days: 90
