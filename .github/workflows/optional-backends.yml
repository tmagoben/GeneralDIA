name: optional-backends

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"
  push:
    branches: [master]
  pull_request:
    paths:
      - "generaldia/**"
      - "examples/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/optional-backends.yml"

jobs:
  quantum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev,quantum]"
      - run: pytest -m optional
      - run: python examples/quantum/03_grouped_shots.py

  pyscf:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev,pyscf]"
      - name: Run complete PySCF-installed suite with scientific coverage gate
        run: >
          pytest --cov=generaldia --cov-report=term-missing
          --cov-report=xml:coverage-pyscf.xml --cov-fail-under=92
      - name: Archive full scientific coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-scientific-pyscf
          path: coverage-pyscf.xml
          if-no-files-found: error
      - run: python examples/pyscf/01_h2_rhf.py
      - run: python examples/pyscf/03_lih_shared_operators.py
