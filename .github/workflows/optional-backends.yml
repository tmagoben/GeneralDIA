name: optional-backends

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"
  pull_request:
    paths:
      - "generaldia/quantum/**"
      - "generaldia/electronic_structure/**"
      - "examples/quantum/**"
      - "examples/pyscf/**"
      - "tests/test_fci_dipoles.py"
      - "tests/test_electronic_structure.py"
      - "pyproject.toml"

jobs:
  quantum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev,quantum]"
      - run: pytest -m optional
      - run: python examples/quantum/03_grouped_shots.py

  pyscf:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev,pyscf]"
      - run: pytest tests/test_electronic_structure.py tests/test_fci_dipoles.py
      - run: python examples/pyscf/01_h2_rhf.py
      - run: python examples/pyscf/03_lih_shared_operators.py
