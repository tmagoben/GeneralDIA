name: optional-backends

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"
  push:
    branches: [master]
  pull_request:
    paths:
      - "generaldia/**"
      - "examples/**"
      - "tests/**"
      - "pyproject.toml"
      - ".coveragerc.all"
      - "scripts/**"
      - "ci/**"
      - ".github/workflows/optional-backends.yml"

jobs:
  minimum-versions:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            ci/minimum-constraints.txt
      - name: Install the declared scientific dependency floors together
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.1.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -c ci/minimum-constraints.txt -e ".[all]"
          python -m pip check
          python -m pip freeze > minimum-versions.txt
      - name: Run full suite on the minimum scientific stack
        run: pytest --cov --cov-config=.coveragerc.all --cov-report=term-missing --cov-report=xml:coverage-minimum.xml
      - name: Preserve dependency and coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimum-version-evidence
          path: |
            minimum-versions.txt
            coverage-minimum.xml
          if-no-files-found: error

  all-backends:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[all]"
      - name: Test all backends with no source exclusions
        run: pytest --cov --cov-config=.coveragerc.all --cov-report=term-missing --cov-report=xml:coverage-all.xml
      - name: Require 90 percent coverage in each optional wrapper
        run: |
          coverage report --rcfile=.coveragerc.all --include="*/electronic_structure/pyscf_backend.py" --fail-under=90
          coverage report --rcfile=.coveragerc.all --include="*/quantum/pennylane_backend.py" --fail-under=90
          coverage report --rcfile=.coveragerc.all --include="*/quantum/qiskit_backend.py" --fail-under=90
      - name: Archive full-source coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-all-backends
          path: coverage-all.xml
          if-no-files-found: error
      - name: Build and test the installed wheel outside the checkout
        run: |
          python -m build
          python -m venv --system-site-packages "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install --no-deps --force-reinstall dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-env/bin/python" -I "$GITHUB_WORKSPACE/scripts/smoke_installed_package.py"

  quantum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev,quantum]"
      - run: pytest -m optional
      - run: python examples/quantum/03_grouped_shots.py

  pyscf:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev,pyscf]"
      - name: Run complete PySCF-installed suite with scientific coverage gate
        run: >
          pytest --cov=generaldia --cov-report=term-missing
          --cov-report=xml:coverage-pyscf.xml --cov-fail-under=92
      - name: Archive full scientific coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-scientific-pyscf
          path: coverage-pyscf.xml
          if-no-files-found: error
      - run: python examples/pyscf/01_h2_rhf.py
      - run: python examples/pyscf/03_lih_shared_operators.py
