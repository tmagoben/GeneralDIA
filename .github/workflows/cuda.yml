name: cuda-hardware

# Opt-in only: a registered Linux/x64 CUDA runner is required. This workflow
# does not provision hardware and never executes automatically for a PR.
on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: Label of a trusted self-hosted CUDA runner
        type: string
        default: gpu
        required: true

permissions:
  contents: read

jobs:
  cuda:
    runs-on: [self-hosted, linux, x64, "${{ inputs.runner_label }}"]
    timeout-minutes: 20
    env:
      GENERALDIA_REQUIRE_CUDA: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Create isolated environment and install CUDA-capable PyTorch
        run: |
          python -m venv "$RUNNER_TEMP/generaldia-cuda-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "$RUNNER_TEMP/generaldia-cuda-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/bin" >> "$GITHUB_PATH"
      - run: python -m pip install -e ".[dev]"
      - name: Require and identify real GPU hardware
        run: |
          python -m torch.utils.collect_env > cuda-environment.txt
          python -c "import torch; assert torch.cuda.is_available(), 'CUDA hardware is required'; print(torch.cuda.get_device_name(0))"
      - name: Validate CPU/CUDA spectra, gradients, optimizer steps and complex holonomy
        run: pytest -m gpu -v --junitxml=cuda-tests.xml
      - name: Preserve hardware evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cuda-hardware-evidence
          path: |
            cuda-environment.txt
            cuda-tests.xml
          if-no-files-found: error
